name: Publication Idéo Nexus 1.7.3

on:
  push:
    branches: ["codex/publish-nexus-1.7.3"]
    paths: [".github/workflows/publish-nexus-1.7.3.yml"]

permissions:
  contents: write

concurrency:
  group: publish-nexus-1.7.3

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code de la version
        uses: actions/checkout@v4
        with:
          ref: "79a17d24df072616ede45e24a48390c930385829"
          persist-credentials: false

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compiler et lancer les tests métier
        shell: pwsh
        run: |
          dotnet build Biblideo.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Biblideo.Core.SmokeTests -c Release --no-build

      - name: Générer l’exécutable Windows
        run: dotnet publish src/Biblideo.App -c Release -r win-x64 --self-contained true -p:NexusPreview=false -p:Version=1.7.3 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Publier Idéo Nexus
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $binary = Join-Path $PWD 'publish/Biblideo.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Biblideo.exe manquant.' }
          $notes = @'
          - Biblidéo : nombre de licences valides par entreprise dans la liste, les cartes et le détail du suivi clients.
          - Atlas : registre présenté par entreprise, avec les postes et leurs licences.
          - Atlas : retrait des licences du registre par poste ou pour toute une entreprise, avec confirmation et historique.
          - Atlas : nom du client lisible dans le sélecteur et calendrier adapté au thème sombre.
          '@
          gh release create v1.7.3 "$binary" --target "79a17d24df072616ede45e24a48390c930385829" --latest --title "Idéo Nexus 1.7.3" --notes "$notes"
