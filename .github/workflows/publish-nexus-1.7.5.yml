name: Publication Idéo Nexus 1.7.5

on:
  push:
    branches: ["codex/publish-nexus-1.7.5"]
    paths: [".github/workflows/publish-nexus-1.7.5.yml"]

permissions:
  contents: write

concurrency:
  group: publish-nexus-1.7.5

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code de la version
        uses: actions/checkout@v4
        with:
          ref: "e2d640ec30a800a13dddb954e84830cf1e66dd8a"
          persist-credentials: false

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compiler et lancer les tests métier
        shell: pwsh
        run: |
          dotnet build Biblideo.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Biblideo.Core.SmokeTests -c Release --no-build

      - name: Générer l’exécutable Windows
        run: dotnet publish src/Biblideo.App -c Release -r win-x64 --self-contained true -p:NexusPreview=false -p:Version=1.7.5 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Publier Idéo Nexus
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $binary = Join-Path $PWD 'publish/Biblideo.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Biblideo.exe manquant.' }
          $notes = @'
          - Biblidéo : la clé complète du mail s’affiche directement dans le suivi des licences et dans la fiche client.
          - Biblidéo : un interrupteur indique si la clé est suivie ou inutilisée.
          - Atlas : l’onglet Suivi des clients propose des vues Liste et Cartes, une recherche, un filtre par état et le détail des postes.
          - Atlas : le calendrier utilise le thème sombre pour améliorer la lisibilité.
          '@
          gh release create v1.7.5 "$binary" --target "e2d640ec30a800a13dddb954e84830cf1e66dd8a" --latest --title "Idéo Nexus 1.7.5" --notes "$notes"
