name: Publication Idéo Nexus 1.7.1

on:
  push:
    branches: ["codex/publish-nexus-1.7.1"]
    paths: [".github/workflows/publish-nexus-1.7.1.yml"]

permissions:
  contents: write

concurrency:
  group: publish-nexus-1.7.1

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code de la version
        uses: actions/checkout@v4
        with:
          ref: "392948595fcab1c51d58e6028bd7cbf173281f37"
          persist-credentials: false

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compiler et vérifier les fiches et le registre
        run: |
          dotnet build Biblideo.sln -c Release
          dotnet run --project tests/Biblideo.Core.SmokeTests -c Release --no-build

      - name: Générer l’exécutable Windows
        run: dotnet publish src/Biblideo.App -c Release -r win-x64 --self-contained true -p:NexusPreview=false -p:Version=1.7.1 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Publier Idéo Nexus
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $binary = Join-Path $PWD 'publish/Biblideo.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Biblideo.exe manquant.' }
          gh release create v1.7.1 "$binary" --target "392948595fcab1c51d58e6028bd7cbf173281f37" --latest --title "Idéo Nexus 1.7.1" --notes "Une fiche client commune, issue de Biblidéo, regroupe l’état des mises à jour et les licences Atlas. Nexus utilise la clé Idéo locale pour générer les licences Atlas Standard et Créateur, copier leur code ou exporter le fichier. Les anciennes licences Atlas peuvent être rattachées à une fiche existante."
